name: ci

on:
  push:
  pull_request:

jobs:
  cpu-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Compile
        run: python -m compileall -q src tests
      - name: Ruff
        run: ruff check src tests
      - name: Tests
        run: pytest
      - name: Import smoke
        run: |
          python - <<'PY'
          import modal_trellis2.core.service
          import modal_trellis2.cli.app
          import modal_trellis2.web.server
          print("imports ok")
          PY

  gpu-source-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Compile Python 3.10 remote sources
        run: python -m compileall -q src/modal_trellis2/modal src/modal_trellis2/core/preprocess.py
