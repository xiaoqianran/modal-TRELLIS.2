[project]
name = "modal-trellis2"
version = "0.1.0"
description = "Upload an image, get a GLB back. Local workbench, Modal GPU for TRELLIS.2."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "xiaoqianran" }]
keywords = ["trellis2", "modal", "image-to-3d", "glb"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
]
dependencies = [
    "typer>=0.16.0",
    "rich>=14.0.0",
    "pydantic>=2.11.0",
    "pydantic-settings>=2.10.0",
    "fastapi>=0.116.0",
    "uvicorn[standard]>=0.35.0",
    "python-multipart>=0.0.20",
    "modal>=1.0.0",
    "pillow>=11.0.0",
    "httpx>=0.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.0",
    "pytest-asyncio>=1.0.0",
]

[project.scripts]
modal-trellis2 = "modal_trellis2.cli.app:main"

[project.urls]
Homepage = "https://github.com/xiaoqianran/modal-TRELLIS.2"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
modal_trellis2 = ["web/static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
